<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE Mock App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Biz+UDGothic&family=DotGothic16&family=Kiwi+Maru&family=M+PLUS+1p&family=M+PLUS+Rounded+1c&family=Noto+Sans+JP&family=Noto+Serif+JP&family=Potta+One&family=Reggae+One&family=Yuji+Syuku&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="font-noto-sans">

    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <h2>ログイン / アカウント作成</h2>
            <input type="email" id="auth-email" placeholder="メールアドレス">
            <input type="password" id="auth-password" placeholder="パスワード">
            <input type="text" id="auth-username" placeholder="希望のユーザーID (英数字)">
            <input type="text" id="auth-bio" placeholder="自己紹介 (任意)">
            <div class="modal-actions">
                <button onclick="handleSignUp()">新規登録</button>
                <button onclick="handleSignIn()">ログイン</button>
            </div>
        </div>
    </div>

    <div id="app">
        <aside id="sidebar">
            <div class="profile-section">
                <img id="my-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='45' height='45'><rect width='45' height='45' fill='%23ccc'/></svg>" alt="Avatar">
                <div class="profile-info">
                    <div id="my-name">未ログイン</div>
                    <small id="my-bio">自己紹介なし</small>
                </div>
            </div>
            
            <div class="font-selector-container">
                <label for="font-select">フォント切替:</label>
                <select id="font-select" onchange="changeAppFont(this.value)">
                    <option value="font-noto-sans">1. Noto Sans (標準)</option>
                    <option value="font-noto-serif">2. Noto Serif (明朝)</option>
                    <option value="font-mplus-rounded">3. M PLUS Rounded (丸ゴシック)</option>
                    <option value="font-mplus-1p">4. M PLUS 1p</option>
                    <option value="font-biz-ud">5. BIZ UDGothic</option>
                    <option value="font-kiwi-maru">6. Kiwi Maru (かわいい)</option>
                    <option value="font-potta-one">7. Potta One (ポップ)</option>
                    <option value="font-dot-gothic">8. DotGothic16 (ドット絵風)</option>
                    <option value="font-reggae-one">9. Reggae One (インパクト)</option>
                    <option value="font-yuji-syuku">10. 裕司 (筆文字風)</option>
                </select>
            </div>

            <div class="actions">
                <button onclick="showQRCode()">QRコード表示</button>
                <button onclick="sendFriendRequestPrompt()">フレンド追加</button>
                <button onclick="createGroupPrompt()">グループ作成</button>
            </div>

            <div class="list-header">チャット一覧</div>
            <ul id="chat-list">
                </ul>
        </aside>

        <main id="chat-area">
            <header id="chat-header">
                <h2 id="current-chat-title">チャットを選択してください</h2>
                <div class="call-buttons">
                    <button id="audio-call-btn" onclick="startCall(false)">音声通話</button>
                    <button id="video-call-btn" onclick="startCall(true)">ビデオ通話</button>
                </div>
            </header>
            
            <div id="messages-container"></div>

            <div id="sticker-picker-panel" class="sticker-panel" style="display:none;">
                <div class="sticker-header">
                    <span>スタンプ選択</span>
                    <label class="btn-upload-sticker">
                        ＋ 追加 <input type="file" accept="image/*" style="display:none;" onchange="uploadCustomSticker(event)">
                    </label>
                </div>
                <div id="sticker-list-content" class="sticker-grid"></div>
            </div>

            <footer id="chat-input-area">
                <input type="text" id="msg-input" placeholder="メッセージを入力...">
                <input type="file" id="file-input" multiple max="10" style="display:none;" onchange="handleFileSelection(event)">
                <button type="button" onclick="document.getElementById('file-input').click()">📁 (最大10)</button>
                <button type="button" onclick="toggleStickerPicker()">😊</button>
                <button type="button" onclick="sendMessage()">送信</button>
            </footer>
        </main>
    </div>

    <div id="video-call-modal" class="modal" style="display:none;">
        <div class="modal-content video-container">
            <video id="local-video" autoplay playsinline muted></video>
            <video id="remote-video" autoplay playsinline></video>
            <button onclick="endCall()">通話終了</button>
        </div>
    </div>

    <div id="qrcode-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>マイQRコード</h3>
            <div id="qrcode"></div>
            <button onclick="closeModal('qrcode-modal')">閉じる</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
